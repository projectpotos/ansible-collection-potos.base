---
name: Release projectpotos.base

# The version bump and changelog land on main through the pull request opened
# by draft-release.yml; publishing the draft release triggers this workflow,
# which only builds and publishes the collection.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: read
    uses: projectpotos/actions/.github/workflows/release-ansible-collection.yaml@31a073ace13fa1f689fe54cd71754f0ecba6dfb6 # v0.5.0
    secrets:
      ANSIBLE_GALAXY_API_KEY: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
