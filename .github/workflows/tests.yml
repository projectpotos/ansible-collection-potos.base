---
name: "CI"

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: projectpotos/actions/.github/workflows/test-ansible-collection.yaml@6155527f763b74eb868aab52fc2c253aa0a1f6f0 # v0.6.2
    with:
      molecule-scenarios: >-
        ["basics", "firstboot", "firstboot_luks", "firstboot_openbao",
         "firstboot_playbook", "periodic", "uki"]
      shellcheck-jinja: true

  all_green:
    name: all_green
    if: ${{ always() }}
    needs:
      - ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify no required job failed or was cancelled
        uses: projectpotos/actions/all-green@6155527f763b74eb868aab52fc2c253aa0a1f6f0 # v0.6.2
        with:
          needs: ${{ toJSON(needs) }}
