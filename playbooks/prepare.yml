---
- name: Potos periodic run - stage 1 (prepare / specs sync)
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Default runtype when invoked outside a timer
    potos_runtype: daily

  pre_tasks:
    - name: Apply the base role
      ansible.builtin.import_role:
        name: projectpotos.base.basics

  tasks:
    - name: Abort gracefully when no specs repo is configured
      ansible.builtin.meta: end_play
      when: basics_specs_url | length == 0

    # The clone token can be stored as a plaintext file (backend: file) or as a
    # systemd-creds encrypted blob (backend: systemd-creds)
    - name: Read specs-repo token from a plaintext file (file backend)
      ansible.builtin.slurp:
        src: "{{ basics_specs_token_file }}"
      register: basics_specs_token_slurp
      when:
        - basics_specs_token_backend == 'file'
        - basics_specs_token_file is file
      no_log: true

    - name: Decrypt specs-repo token from a systemd-creds blob (systemd-creds backend)
      projectpotos.base.systemd_creds:
        action: decrypt
        name: "{{ basics_specs_token_name }}"
        input_path: "{{ basics_specs_token_file }}"
      register: basics_specs_token_creds
      when:
        - basics_specs_token_backend == 'systemd-creds'
        - basics_specs_token_file is file
      no_log: true

    - name: Resolve the effective specs token
      ansible.builtin.set_fact:
        basics_specs_token_value: >-
          {{ (basics_specs_token_slurp.content | b64decode)
             if (basics_specs_token_slurp.content is defined)
             else (basics_specs_token_creds.plaintext | default('')) }}
      no_log: true

    - name: Build authenticated specs URL
      ansible.builtin.set_fact:
        basics_specs_effective_url: >-
          {%- if basics_specs_token_value | length > 0 and
                 basics_specs_url.startswith(('http://', 'https://')) -%}
          {%- set _token = basics_specs_token_value | trim -%}
          {%- set _split = basics_specs_url.split('://', 1) -%}
          {{ _split[0] }}://x-access-token:{{ _token | urlencode }}@{{ _split[1] }}
          {%- else -%}
          {{ basics_specs_url }}
          {%- endif -%}
      no_log: true

    - name: Wipe previous specs clone
      ansible.builtin.file:
        path: "{{ basics_specs_clone_dir }}"
        state: absent

    - name: Clone the specs repo
      ansible.builtin.git:
        repo: "{{ basics_specs_effective_url }}"
        dest: "{{ basics_specs_clone_dir }}"
        version: "{{ basics_specs_branch }}"
        single_branch: true
        depth: 1
        accept_newhostkey: true
      no_log: true

    - name: Check for specs requirements.yml
      ansible.builtin.stat:
        path: "{{ basics_specs_clone_dir }}/requirements.yml"
      register: basics_specs_requirements

    - name: Read the specs requirements.yml
      ansible.builtin.slurp:
        src: "{{ basics_specs_clone_dir }}/requirements.yml"
      register: basics_specs_requirements_raw
      when: basics_specs_requirements.stat.exists

    # projectpotos.base in the specs requirements would shadow the system-wide
    # install in stage 2 while stage 1 keeps running the old version - a silent
    # split-brain. The base collection is pinned in base-requirements.yml
    # instead (see below), which updates it for both stages.
    - name: Fail when the specs requirements.yml would shadow projectpotos.base
      ansible.builtin.assert:
        that:
          - basics_specs_shadowing | length == 0
        fail_msg: >-
          The specs requirements.yml must not list projectpotos.base
          (found: {{ basics_specs_shadowing | join(', ') }}).
          Pin it in base-requirements.yml instead, so stage 1 and stage 2
          run the same version.
      vars:
        basics_specs_shadowing: >-
          {{ (basics_specs_requirements_raw.content | b64decode | from_yaml).collections
             | default([], true)
             | map('string')
             | select('search', 'projectpotos\.base|ansible-collection-potos\.base')
             | list }}
      when: basics_specs_requirements.stat.exists

    # Wiped after (not before) a successful clone: dependencies removed from
    # requirements.yml disappear, but a failed clone or unreachable specs repo
    # leaves the last good install untouched.
    - name: Wipe the specs galaxy dir
      ansible.builtin.file:
        path: "{{ basics_specs_galaxy_dir }}"
        state: absent

    - name: Recreate the specs galaxy dir
      ansible.builtin.file:
        path: "{{ basics_specs_galaxy_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Install specs collections
      ansible.builtin.command:
        cmd: >-
          {{ basics_virtenvdir }}/bin/ansible-galaxy collection install
          -r {{ basics_specs_clone_dir }}/requirements.yml
          -p {{ basics_specs_galaxy_dir }}/collections
          --force
      when: basics_specs_requirements.stat.exists
      changed_when: true

    - name: Install specs roles
      ansible.builtin.command:
        cmd: >-
          {{ basics_virtenvdir }}/bin/ansible-galaxy role install
          -r {{ basics_specs_clone_dir }}/requirements.yml
          -p {{ basics_specs_galaxy_dir }}/roles
          --force
      when: basics_specs_requirements.stat.exists
      changed_when: true

    - name: Check for the specs runtime.yml
      ansible.builtin.stat:
        path: "{{ basics_specs_clone_dir }}/runtime.yml"
      register: basics_specs_runs_stat

    - name: Fail when specs runtime.yml is missing
      ansible.builtin.fail:
        msg: >-
          The specs repository at {{ basics_specs_url }} does not contain
          a runtime.yml at its root. This file is required and declares which
          roles run for each runtype.
      when: not basics_specs_runs_stat.stat.exists

    # Self-update of projectpotos.base from the specs repo's optional
    # base-requirements.yml.
    # This must be the last task of the play, so no include_* use an updated version mid run.
    - name: Check for the specs base-requirements.yml
      ansible.builtin.stat:
        path: "{{ basics_base_requirements_file }}"
      register: basics_base_requirements

    - name: Update projectpotos.base from the specs base-requirements.yml
      ansible.builtin.command:
        cmd: >-
          {{ basics_virtenvdir }}/bin/ansible-galaxy collection install
          -r {{ basics_base_requirements_file }}
          -p {{ basics_system_collections_dir }}
          --force
      when: basics_base_requirements.stat.exists
      register: basics_base_update
      changed_when: basics_base_update.rc == 0
      failed_when: false

    # Show a warning when the self-update failed, but don't fail the play. The
    # installed version is still usable. Otherwise we leave the system in a broken state.
    - name: Warn when the projectpotos.base self-update failed
      ansible.builtin.debug:
        msg: >-
          WARNING: updating projectpotos.base from
          {{ basics_base_requirements_file }} failed
          (rc={{ basics_base_update.rc }}); continuing with the installed
          version. stderr: {{ basics_base_update.stderr | default('') }}
      when:
        - basics_base_requirements.stat.exists
        - basics_base_update.rc != 0
