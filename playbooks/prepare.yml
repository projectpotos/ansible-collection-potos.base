---
- name: Potos periodic run - stage 1 (prepare / specs sync)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    # Default runtype when invoked outside a timer
    potos_runtype: daily

  pre_tasks:
    - name: Apply the base role
      ansible.builtin.import_role:
        name: potos.base.potos_basics

  tasks:
    - name: Abort gracefully when no specs repo is configured
      ansible.builtin.meta: end_play
      when: potos_basics_specs_url | length == 0

    - name: Read specs-repo token if present
      ansible.builtin.slurp:
        src: "{{ potos_basics_specs_token_file }}"
      register: potos_basics_specs_token
      when: potos_basics_specs_token_file is file
      no_log: true

    - name: Build authenticated specs URL
      ansible.builtin.set_fact:
        potos_basics_specs_effective_url: >-
          {%- if potos_basics_specs_token.content is defined and
                 potos_basics_specs_url.startswith(('http://', 'https://')) -%}
          {%- set _token = potos_basics_specs_token.content | trim -%}
          {%- set _split = potos_basics_specs_url.split('://', 1) -%}
          {{ _split[0] }}://x-access-token:{{ _token | urlencode }}@{{ _split[1] }}
          {%- else -%}
          {{ potos_basics_specs_url }}
          {%- endif -%}
      no_log: true

    - name: Wipe previous specs clone
      ansible.builtin.file:
        path: "{{ potos_basics_specs_clone_dir }}"
        state: absent

    - name: Clone the specs repo
      ansible.builtin.git:
        repo: "{{ potos_basics_specs_effective_url }}"
        dest: "{{ potos_basics_specs_clone_dir }}"
        version: "{{ potos_basics_specs_branch }}"
        single_branch: true
        depth: 1
        accept_newhostkey: true
      no_log: true

    - name: Check for specs requirements.yml
      ansible.builtin.stat:
        path: "{{ potos_basics_specs_clone_dir }}/requirements.yml"
      register: potos_basics_specs_requirements

    - name: Install specs collections
      ansible.builtin.command:
        cmd: >-
          {{ potos_basics_virtenvdir }}/bin/ansible-galaxy collection install
          -r {{ potos_basics_specs_clone_dir }}/requirements.yml
          -p {{ potos_basics_specs_galaxy_dir }}/collections
          --force
      when: potos_basics_specs_requirements.stat.exists
      changed_when: true

    - name: Install specs roles into a per-clone galaxy dir
      ansible.builtin.command:
        cmd: >-
          {{ potos_basics_virtenvdir }}/bin/ansible-galaxy role install
          -r {{ potos_basics_specs_clone_dir }}/requirements.yml
          -p {{ potos_basics_specs_galaxy_dir }}/roles
          --force
      when: potos_basics_specs_requirements.stat.exists
      changed_when: true

    - name: Check for the specs runtime.yml
      ansible.builtin.stat:
        path: "{{ potos_basics_specs_clone_dir }}/runtime.yml"
      register: potos_basics_specs_runs_stat

    - name: Fail when specs runtime.yml is missing
      ansible.builtin.fail:
        msg: >-
          The specs repository at {{ potos_basics_specs_url }} does not contain
          a runtime.yml at its root. This file is required and declares which
          roles run for each runtype.
      when: not potos_basics_specs_runs_stat.stat.exists
