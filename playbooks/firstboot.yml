---
- name: Potos firstboot Magier
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Check if firstboot ran already
      ansible.builtin.stat:
        path: /var/lib/potos/firstboot.done
      register: firstboot_marker

    - name: End play if firstboot already completed
      ansible.builtin.meta: end_play
      when: firstboot_marker.stat.exists

  tasks:
    - name: Run the default firstboot wizard
      ansible.builtin.include_role:
        name: projectpotos.base.firstboot

    - name: Install and run firstboot_extra_roles from the system config
      when: (potos_config.firstboot_extra_roles | default([])) | length > 0
      block:
        - name: Create a tempdir for extra roles
          ansible.builtin.tempfile:
            state: directory
            suffix: potos-firstboot-roles
          register: firstboot_extras_dir

        - name: Write a requirements.yml for ansible-galaxy
          ansible.builtin.copy:
            content: "{{ potos_config.firstboot_extra_roles | to_nice_yaml }}"
            dest: "{{ firstboot_extras_dir.path }}/requirements.yml"
            owner: root
            group: root
            mode: "0644"

        # TODO: support collections as well
        - name: Install extra roles
          ansible.builtin.command:
            cmd: >-
              ansible-galaxy role install
              -r {{ firstboot_extras_dir.path }}/requirements.yml
              -p {{ firstboot_extras_dir.path }}/roles
          changed_when: true

        - name: Run each extra firstboot role
          ansible.builtin.include_role:
            name: "{{ _role.name }}"
          loop: "{{ potos_config.firstboot_extra_roles }}"
          loop_control:
            loop_var: _role
            label: "{{ _role.name }}"
          vars:
            ansible_role_path: "{{ firstboot_extras_dir.path }}/roles"

      always:
        - name: Clean up extras dir
          ansible.builtin.file:
            path: "{{ firstboot_extras_dir.path }}"
            state: absent
          when: firstboot_extras_dir is defined

    - name: Apply base role
      ansible.builtin.include_role:
        name: projectpotos.base.basics

    - name: Remove the firstboot autostart entry
      ansible.builtin.file:
        path: /etc/xdg/autostart/potos-firstboot.desktop
        state: absent

    - name: Mark firstboot as done
      ansible.builtin.copy:
        dest: /var/lib/potos/firstboot.done
        content: "{{ ansible_facts.date_time.iso8601 }}\n"
        owner: root
        group: root
        mode: "0644"
