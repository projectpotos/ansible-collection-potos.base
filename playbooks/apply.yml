---
- name: Potos periodic run - stage 2 (apply specs)
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Default runtype when invoked outside a timer
    potos_runtype: daily

  pre_tasks:
    - name: Read the specs runtime.yml from the managed machine
      ansible.builtin.slurp:
        src: "{{ potos_specs_dir }}/runtime.yml"
      register: potos_specs_runs_raw

    - name: Load the specs runtime.yml
      ansible.builtin.set_fact:
        potos_specs_runs: "{{ potos_specs_runs_raw.content | b64decode | from_yaml }}"

    - name: Validate the runtime.yml structure
      ansible.builtin.assert:
        that:
          - potos_specs_runs.runtypes is mapping
          - potos_runtype in potos_specs_runs.runtypes
          - potos_specs_runs.runtypes[potos_runtype] is iterable
        fail_msg: >-
          {{ potos_specs_dir }}/runtime.yml must define
          runtypes.{{ potos_runtype }} as a list of role names.

  tasks:
    - name: Run roles for runtype "{{ potos_runtype }}"
      ansible.builtin.include_role:
        name: "{{ _role }}"
      loop: "{{ potos_specs_runs.runtypes[potos_runtype] }}"
      loop_control:
        loop_var: _role
        label: "{{ _role }}"
