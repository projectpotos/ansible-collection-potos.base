---
# Category: group / Step: create
# Create a local group.
#
# inputs:
#   name    str   required. Group name.
#   gid     int   optional. GID to assign.
#   system  bool  default false. Create as a system group.
#   state   str   default present. 'present' or 'absent'.
#   local   bool  default false. Force local operations.
# outputs:
#   name  str  the group name

- name: "{{ step.uses }} ({{ step.id }}): Apply input defaults"
  ansible.builtin.set_fact:
    step_input: "{{ step_defaults | combine(step_input) }}"
  vars:
    step_defaults:
      system: false
      state: present
      local: false

- name: "{{ step.uses }} ({{ step.id }}): Validate required inputs"
  ansible.builtin.assert:
    that:
      - step_input.name | default('') | length > 0
    fail_msg: "group/create requires a 'name' input."
    quiet: true

- name: "{{ step.uses }} ({{ step.id }}): Create the group"
  ansible.builtin.group:
    name: "{{ step_input.name }}"
    gid: "{{ step_input.gid | default(omit) }}"
    system: "{{ step_input.system }}"
    state: "{{ step_input.state }}"
    local: "{{ step_input.local }}"

- name: "{{ step.uses }} ({{ step.id }}): Register outputs"
  ansible.builtin.include_tasks: steps/_register.yml
  vars:
    step_output:
      name: "{{ step_input.name }}"
