---
# Packages required by the wrapper script and ansible runs.
potos_basics_packages:
  - git
  - bc
  - util-linux
  - libnotify
  - coreutils
  - procps-ng
  - python3
  - python3-pip
  - python3-virtualenv
  - NetworkManager
  - gawk

# Pin ansible-core inside the virtualenv. Override per host if needed.
potos_basics_ansible_version: "2.20.6"
