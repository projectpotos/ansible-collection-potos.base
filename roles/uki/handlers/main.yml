---
- name: Rebuild and re-sign the UKIs for all installed kernels
  listen: uki_rebuild
  ansible.builtin.command:
    argv: [kernel-install, add-all, --verbose]
  environment:
    BOOT_ROOT: "{{ uki_esp_dir }}"
  changed_when: true

- name: Reload systemd
  listen: uki_systemd_reload
  ansible.builtin.systemd:
    daemon_reload: true

- name: Re-arm the boot chain watch
  listen: uki_path_restart
  ansible.builtin.command:
    argv: [systemctl, try-restart, potos-bootchain-heal.path]
  changed_when: true
