---
- name: Ensure the potos directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ uki_libexec_dir }}"
    - "{{ uki_selinux_dir }}"

- name: Install the boot chain heal script
  ansible.builtin.template:
    src: usr/libexec/potos/bootchain-heal.sh.j2
    dest: "{{ uki_libexec_dir }}/bootchain-heal.sh"
    owner: root
    group: root
    mode: "0755"

- name: Install the boot chain heal units
  ansible.builtin.template:
    src: "etc/systemd/system/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - potos-bootchain-heal.service
    - potos-bootchain-heal.path
  notify: uki_systemd_reload

- name: Install the SELinux policy for the bootloader watch
  ansible.builtin.copy:
    src: potos-bootchain-heal.cil
    dest: "{{ uki_selinux_dir }}/potos-bootchain-heal.cil"
    owner: root
    group: root
    mode: "0644"
  register: uki_cil

- name: Check for an SELinux policy store
  ansible.builtin.stat:
    path: /etc/selinux/config
  register: uki_selinux_config

- name: List the installed SELinux modules
  ansible.builtin.command:
    argv: [semodule, -n, -l]
  register: uki_semodule_list
  changed_when: false
  failed_when: false
  when: uki_selinux_config.stat.exists

# -n: only update the policy store.
- name: Install the SELinux policy module
  ansible.builtin.command:
    argv: [semodule, -n, -i, "{{ uki_selinux_dir }}/potos-bootchain-heal.cil"]
  when:
    - uki_selinux_config.stat.exists
    - uki_semodule_list.rc == 0
    - uki_cil is changed or 'potos-bootchain-heal' not in uki_semodule_list.stdout
  changed_when: true

- name: Enable the boot chain heal units
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - potos-bootchain-heal.path
    - potos-bootchain-heal.service
