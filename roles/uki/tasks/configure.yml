---
- name: Check for the boot splash
  ansible.builtin.stat:
    path: "{{ uki_splash }}"
  register: uki_splash_stat

- name: Record whether the boot splash is available
  ansible.builtin.set_fact:
    uki_splash_available: "{{ uki_splash_stat.stat.exists }}"

- name: Write the kernel-install configuration
  ansible.builtin.template:
    src: etc/kernel/install.conf.j2
    dest: /etc/kernel/install.conf
    owner: root
    group: root
    mode: "0644"
  notify: uki_rebuild

- name: Write the UKI build configuration
  ansible.builtin.template:
    src: etc/kernel/uki.conf.j2
    dest: /etc/kernel/uki.conf
    owner: root
    group: root
    mode: "0644"
  notify: uki_rebuild

- name: Check whether dracut ships the renamed pcrextend module
  ansible.builtin.stat:
    path: /usr/lib/dracut/modules.d/11systemd-pcrextend
  register: uki_pcrextend_module

- name: Use the pcrextend module name on dracut 110 and newer
  ansible.builtin.set_fact:
    uki_dracut_modules: "{{ uki_dracut_modules | map('replace', 'systemd-pcrphase', 'systemd-pcrextend') | list }}"
  when: uki_pcrextend_module.stat.exists

- name: Enable the measured boot dracut modules
  ansible.builtin.template:
    src: etc/dracut.conf.d/measured-boot.conf.j2
    dest: /etc/dracut.conf.d/measured-boot.conf
    owner: root
    group: root
    mode: "0644"
  notify: uki_rebuild
