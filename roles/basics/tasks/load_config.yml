---
- name: Check for system config file
  ansible.builtin.stat:
    path: "{{ basics_config_file }}"
  register: basics_config_stat

- name: Fail when the system config is missing
  ansible.builtin.fail:
    msg: >-
      The Potos system config was not found at {{ basics_config_file }}
      on the managed node. This file is required.
  when: not basics_config_stat.stat.exists

- name: Read system config from the managed node
  ansible.builtin.slurp:
    src: "{{ basics_config_file }}"
  register: basics_config_raw

- name: Load system config
  ansible.builtin.set_fact:
    potos_config: "{{ basics_config_raw.content | b64decode | from_yaml }}"

- name: Apply derived base role variables from system config
  ansible.builtin.set_fact:
    basics_specs_url: >-
      {{ potos_config.specs.url | default(basics_specs_url) }}
    basics_specs_branch: >-
      {{ potos_config.specs.branch | default(basics_specs_branch) }}
    basics_client_name: >-
      {{ potos_config.client_name.short | default(basics_client_name) }}

- name: Apply credential backend settings from system config
  ansible.builtin.set_fact:
    basics_specs_token_backend: >-
      {{ _specs_token.backend | default(basics_specs_token_backend) }}
    basics_specs_token_file: >-
      {{ _specs_token.path | default(basics_specs_token_file) }}
    basics_specs_token_name: >-
      {{ _specs_token.name | default(basics_specs_token_name) }}
    basics_ansible_vault_key_backend: >-
      {{ _vault_key.backend | default(basics_ansible_vault_key_backend) }}
    basics_ansible_vault_key_file: >-
      {{ _vault_key.path | default(basics_ansible_vault_key_file) }}
    basics_ansible_vault_key_name: >-
      {{ _vault_key.name | default(basics_ansible_vault_key_name) }}
  vars:
    _credentials: "{{ potos_config.credentials | default({}, true) }}"
    _specs_token: "{{ _credentials.specs_token | default({}, true) }}"
    _vault_key: "{{ _credentials.ansible_vault_key | default({}, true) }}"

- name: Apply role_vars from system config
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ (potos_config.role_vars | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
