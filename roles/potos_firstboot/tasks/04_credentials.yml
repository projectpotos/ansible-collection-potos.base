---
# Acquire the single token used by the periodic potos run to clone the
# (potentially private) specs repository. The role never accepts secrets
# baked into the ISO; it resolves the token at firstboot from one of:
# prompt | openbao | script.

- name: Ensure /etc/potos exists with restrictive permissions
  ansible.builtin.file:
    path: /etc/potos
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Acquire specs-repo token from prompt
  ansible.builtin.include_tasks: credentials/prompt.yml
  when: potos_firstboot_credentials_source == 'prompt'

- name: Acquire specs-repo token from openbao (OIDC device flow)
  ansible.builtin.include_tasks: credentials/openbao.yml
  when: potos_firstboot_credentials_source == 'openbao'

- name: Acquire specs-repo token from user-defined script
  ansible.builtin.include_tasks: credentials/script.yml
  when: potos_firstboot_credentials_source == 'script'

- name: Fail when the configured source did not yield a token
  ansible.builtin.fail:
    msg: >-
      Credential source '{{ potos_firstboot_credentials_source }}' did not
      produce a specs-repo token.
  when:
    - potos_firstboot_credentials_token | default('') | length == 0

- name: Write specs-repo token to disk
  ansible.builtin.copy:
    dest: "{{ potos_firstboot_credentials_token_file }}"
    content: "{{ potos_firstboot_credentials_token }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true
