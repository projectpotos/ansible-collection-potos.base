---
- name: Check for the Potos system config file
  ansible.builtin.stat:
    path: "{{ potos_firstboot_config_file }}"
  register: potos_firstboot_config_stat

- name: Fail when the system config is missing
  ansible.builtin.fail:
    msg: >-
      The Potos system config was not found at {{ potos_firstboot_config_file }}
      on the managed machine.
  when: not potos_firstboot_config_stat.stat.exists

- name: Read the Potos system config
  ansible.builtin.slurp:
    src: "{{ potos_firstboot_config_file }}"
  register: potos_firstboot_config_raw

- name: Parse the Potos system config
  ansible.builtin.set_fact:
    potos_firstboot_config: "{{ potos_firstboot_config_raw.content | b64decode | from_yaml }}"

- name: Parse the firstboot step list from the system config
  ansible.builtin.set_fact:
    potos_firstboot_step_list: >-
      {{ potos_firstboot_config.firstboot.steps | default([], true) }}

- name: Apply debug settings from the system config
  ansible.builtin.set_fact:
    potos_firstboot_debug_no_log: >-
      {{ (potos_firstboot_config.debug | default({}, true)).no_log
         | default(potos_firstboot_debug_no_log) | bool }}
