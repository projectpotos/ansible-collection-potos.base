---
- name: Ensure the credential script exists
  ansible.builtin.stat:
    path: "{{ potos_firstboot_credentials_script }}"
  register: potos_firstboot_credentials_script_stat

- name: Fail when the credential script is missing
  ansible.builtin.fail:
    msg: >-
      Credential script {{ potos_firstboot_credentials_script }} is missing;
      the ISO build is expected to install it.
  when: not potos_firstboot_credentials_script_stat.stat.exists

- name: Run the credential script
  ansible.builtin.command:
    cmd: "{{ potos_firstboot_credentials_script }}"
  register: potos_firstboot_credentials_script_run
  changed_when: false
  no_log: true

- name: Capture the script-produced token
  ansible.builtin.set_fact:
    potos_firstboot_credentials_token: "{{ potos_firstboot_credentials_script_run.stdout }}"
  no_log: true
