---
- name: Prompt the user for the specs-repo token
  potos.base.yad:
    dialog: form
    title: "{{ potos_firstboot_client_name }} credentials"
    text: Please paste the access token for the specs repository below.
    fullscreen: true
    borders: 20
    align: center
    image: "{{ potos_firstboot_logo }}"
    image_on_top: true
    fields:
      - label: Token
        type: H
    buttons:
      - label: OK
        id: 0
    validations:
      - type: required
        field: Token
        error_message: A specs-repo token is required.
    max_attempts: 0
  register: potos_firstboot_credentials_prompt
  changed_when: false
  no_log: true
  tags:
    - molecule-notest

- name: Capture the prompted token
  ansible.builtin.set_fact:
    potos_firstboot_credentials_token: >-
      {{ potos_firstboot_credentials_prompt.fields['Token'] | trim }}
  no_log: true
