---
- name: Locate the bao/vault CLI
  ansible.builtin.command: "which {{ item }}"
  loop:
    - bao
    - vault
  register: potos_firstboot_openbao_which
  changed_when: false
  failed_when: false

- name: Pick the available CLI
  ansible.builtin.set_fact:
    potos_firstboot_openbao_cli: >-
      {{ (potos_firstboot_openbao_which.results
          | selectattr('rc', 'equalto', 0) | list | first).stdout
         | default('') }}

- name: Fail if no bao/vault CLI is installed
  ansible.builtin.fail:
    msg: "Neither 'bao' nor 'vault' CLI is installed; cannot use credentials_source=openbao."
  when: potos_firstboot_openbao_cli == ''

- name: Display device-flow login prompt to the user
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      yad --fullscreen --title '{{ potos_firstboot_client_name }} Openbao login' \
        --borders 20 --align center --button gtk-ok \
        --image-on-top --image=/setup/logo.png \
        --text "A browser device-code login will start in the next terminal window.\n\nFollow the printed instructions on any device with a browser."
  changed_when: false
  tags:
    - molecule-notest

- name: Perform OIDC device-flow login
  ansible.builtin.command:
    cmd: >-
      {{ potos_firstboot_openbao_cli }} login -method=oidc
      -path={{ potos_firstboot_credentials_openbao.mount }}
      role={{ potos_firstboot_credentials_openbao.role }}
    creates: "/root/.vault-token"
  environment:
    VAULT_ADDR: "{{ potos_firstboot_credentials_openbao.url }}"
    BAO_ADDR: "{{ potos_firstboot_credentials_openbao.url }}"

- name: Read the specs-repo token from openbao
  ansible.builtin.command:
    cmd: >-
      {{ potos_firstboot_openbao_cli }} kv get
      -field={{ potos_firstboot_credentials_openbao.field }}
      {{ potos_firstboot_credentials_openbao.secret_path }}
  environment:
    VAULT_ADDR: "{{ potos_firstboot_credentials_openbao.url }}"
    BAO_ADDR: "{{ potos_firstboot_credentials_openbao.url }}"
  register: potos_firstboot_openbao_secret
  changed_when: false
  no_log: true

- name: Capture the openbao-sourced token
  ansible.builtin.set_fact:
    potos_firstboot_credentials_token: "{{ potos_firstboot_openbao_secret.stdout }}"
  no_log: true
