---
argument_specs:
  main:
    short_description: First-boot wizard for Potos Linux Clients.
    description:
      - Runs a configurable, ordered list of first-boot steps. The step list is
        read from the potos system config (C(firstboot.steps)); each step
        takes custom inputs and may publish outputs consumed by later steps via
        C({{ steps.<id>.<field> }}) references.
      - This role is intentionally decoupled from the specs repository.
    options:
      firstboot_setup_dir:
        description:
          - Directory the wizard renders helper scripts into.
        type: str
        default: /var/lib/potos/setup
      firstboot_logo:
        description:
          - Logo image shown in the firstboot dialogs.
        type: str
        default: /usr/share/potos/logo.png
      firstboot_precommands:
        description: Commands to execute before the first-boot steps.
        type: list
        elements: str
        default: []
      firstboot_postcommands:
        description: Commands to execute after the first-boot steps.
        type: list
        elements: str
        default: []
      firstboot_ask_keyboardlayout:
        description: Whether the keyboard-layout picker is offered in dialogs.
        type: bool
        default: true
      firstboot_ask_select_keyboardlayout:
        description: Prompt shown in the keyboard-layout picker.
        type: str
        default: Please select your keyboard layout
      firstboot_client_name:
        description: Short client name used in dialog titles.
        type: str
        default: potos
      firstboot_config_file:
        description:
          - Path to the potos system config.
        type: str
        default: /etc/potos/config.yml
      firstboot_extra_roles:
        description: Additional roles to run after the default firstboot tasks.
        type: list
        elements: dict
        default: []
      firstboot_done_marker:
        description: Marker file written when firstboot has completed.
        type: str
        default: /var/lib/potos/firstboot.done
      firstboot_autostart_file:
        description: Autostart .desktop file that launches the firstboot wizard.
        type: str
        default: /etc/xdg/autostart/potos-firstboot.desktop
      firstboot_activate_timer:
        description: Activate the periodic potos timer after firstboot completes.
        type: bool
        default: true
