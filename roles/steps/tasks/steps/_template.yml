---
# Step template. Copy this to tasks/steps/<category>/<step>.yml and adapt.
#
# Contract:
#   - Read inputs ONLY from `step_input` (a dict). Never read role/global vars
#     for step configuration; that keeps steps reusable and decoupled.
#   - Declare every default ONCE as the first task: merge a `step_defaults`
#     dict over `step_input` (see below). Later tasks then read `step_input.x`
#     directly -- no inline `| default(...)`. Truly-optional pass-through
#     inputs (those forwarded with `| default(omit)`) have no default value, so
#     they stay out of `step_defaults`. Add `no_log` to the merge when any
#     input may carry a secret.
#   - You may skip the whole step based on its inputs via `when`.
#   - Dialog (yad) tasks must carry the `molecule-notest` tag so CI does not
#     block on a GUI.
#   - Publish outputs (if any) by including steps/_register.yml with a
#     `step_output` dict. For secrets, also pass `step_output_secret: true`.
#   - Prefer a small Python module (plugins/modules/) over unreadable
#     shell/Jinja for real logic.
#   - Prefix every task `name` with "{{ step.uses }} ({{ step.id }}): " so the
#     play output identifies which configured step a task belongs to. Both vars
#     come from the dispatcher loop and are in scope here. (This intentionally
#     puts a template at the start of the name; name[template] is skipped in
#     .ansible-lint for that reason.)

# 1) Declare all defaults once, then read step_input.* directly afterwards.
- name: "{{ step.uses }} ({{ step.id }}): Apply input defaults"
  ansible.builtin.set_fact:
    step_input: "{{ step_defaults | combine(step_input) }}"
  vars:
    step_defaults:
      example: nothing
  # no_log: "{{ not steps_debug_no_log }}"  # when inputs are secret

# 2) Validate inputs. Use assert to check required inputs and fail early with a clear message.
#    This doesn't make much sense for inputs with a default (as in this example), but I think you get the idea.
- name: "{{ step.uses }} ({{ step.id }}): Validate required inputs"
  ansible.builtin.assert:
    that:
      - step_input.example | default('') | length > 0
    fail_msg: "{{ step.uses }} requires 'example' input."
    quiet: true

# 2) Do the work. Example: collect a value (here just an echo of an input).
- name: "{{ step.uses }} ({{ step.id }}): Example work"
  ansible.builtin.debug:
    msg: "would act on {{ step_input.example }}"

# 3) Publish outputs so later steps can use {{ steps.<this id>.result }}.
- name: "{{ step.uses }} ({{ step.id }}): Register outputs"
  ansible.builtin.include_tasks: steps/_register.yml
  vars:
    step_output:
      result: "{{ step_input.example | default('') }}"
    # step_output_secret: true   # uncomment when an output is sensitive
