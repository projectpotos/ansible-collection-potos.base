---
# Category: luks / Step: random_rotate
# Replace the (known) current LUKS passphrase with a generated random one and
# output it.
#
# inputs:
#   current_passphrase   str   required. The existing passphrase to change from
#                              (typically the ISO default).
#   device               str   optional. Override crypttab discovery.
#   length               int   default 64. Generated passphrase length.
#   skip_if_unencrypted  bool  default true. No-op when no LUKS device exists.
# outputs:
#   passphrase  str  the generated passphrase (secret)

- name: "{{ step.uses }} ({{ step.id }}): Apply input defaults"
  ansible.builtin.set_fact:
    step_input: "{{ step_defaults | combine(step_input) }}"
  vars:
    step_defaults:
      length: 64
      skip_if_unencrypted: true
  no_log: "{{ not steps_debug_no_log }}"

- name: "{{ step.uses }} ({{ step.id }}): Discover the LUKS device"
  projectpotos.base.luks:
    action: discover
    device: "{{ step_input.device | default(omit) }}"
  register: luks_random_info

- name: "{{ step.uses }} ({{ step.id }}): Fail when no LUKS device and skipping is disabled"
  ansible.builtin.fail:
    msg: "luks/random_rotate found no LUKS device and skip_if_unencrypted is false."
  when:
    - not luks_random_info.encrypted
    - not (step_input.skip_if_unencrypted | bool)

- name: "{{ step.uses }} ({{ step.id }}): Rotate to a random passphrase"
  when: luks_random_info.encrypted
  block:
    - name: "{{ step.uses }} ({{ step.id }}): Validate the current passphrase was provided"
      ansible.builtin.assert:
        that:
          - step_input.current_passphrase | default('') | length > 0
        fail_msg: "luks/random_rotate requires 'current_passphrase'."
        quiet: true

    - name: "{{ step.uses }} ({{ step.id }}): Generate and apply a random LUKS passphrase"
      projectpotos.base.luks:
        action: change_key
        device: "{{ luks_random_info.device }}"
        passphrase: "{{ step_input.current_passphrase }}"
        generate: true
        length: "{{ step_input.length }}"
      register: luks_random_result
      no_log: "{{ not steps_debug_no_log }}"

    - name: "{{ step.uses }} ({{ step.id }}): Register outputs"
      ansible.builtin.include_tasks: steps/_register.yml
      vars:
        step_output:
          passphrase: "{{ luks_random_result.passphrase }}"
        step_output_secret: true
