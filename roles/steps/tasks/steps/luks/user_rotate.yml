---
# Category: luks / Step: user_rotate
# Let the operator change the LUKS passphrase
#
# The dialog adapts to the inputs: it asks only for the passphrases that were
# not preset. Supplying current_passphrase (e.g. the ISO default) asks for just
# the new one; supplying new_passphrase asks for just the current one.
#
# inputs:
#   ask                  bool  default true. Ask for any passphrase not supplied
#                              below. With ask=false both must be preset.
#   current_passphrase   str   optional. The existing passphrase. When set it is
#                              used as-is; otherwise the dialog asks for it.
#                              Required when ask=false.
#   new_passphrase       str   optional. The replacement passphrase. When set it
#                              is used as-is; otherwise the dialog asks for it.
#                              Required when ask=false.
#   device               str   optional. Override crypttab discovery.
#   password_policy      dict  optional. See yad_password_validation. Applies to
#                              the new passphrase prompt.
#   skip_if_unencrypted  bool  default true. No-op when no LUKS device exists.
# outputs:
#   passphrase  str  the new passphrase that was set (secret)

- name: "{{ step.uses }} ({{ step.id }}): Apply input defaults"
  ansible.builtin.set_fact:
    step_input: "{{ step_defaults | combine(step_input) }}"
  vars:
    step_defaults:
      ask: true
      password_policy: {}
      skip_if_unencrypted: true
  no_log: "{{ not steps_debug_no_log }}"

- name: "{{ step.uses }} ({{ step.id }}): Discover the LUKS device"
  projectpotos.base.luks:
    action: discover
    device: "{{ step_input.device | default(omit) }}"
  register: luks_user_info

- name: "{{ step.uses }} ({{ step.id }}): Fail when no LUKS device and skipping is disabled"
  ansible.builtin.fail:
    msg: "luks/user_rotate found no LUKS device and skip_if_unencrypted is false."
  when:
    - not luks_user_info.encrypted
    - not (step_input.skip_if_unencrypted | bool)

- name: "{{ step.uses }} ({{ step.id }}): Rotate the passphrase"
  when: luks_user_info.encrypted
  block:
    - name: "{{ step.uses }} ({{ step.id }}): Decide which passphrases to ask for"
      ansible.builtin.set_fact:
        luks_user_ask_current: "{{ (step_input.current_passphrase | default('')) | length == 0 }}"
        luks_user_ask_new: "{{ (step_input.new_passphrase | default('')) | length == 0 }}"
      no_log: "{{ not steps_debug_no_log }}"

    - name: "{{ step.uses }} ({{ step.id }}): Validate presets when not asking interactively"
      ansible.builtin.assert:
        that:
          - not luks_user_ask_current
          - not luks_user_ask_new
        fail_msg: "luks/user_rotate with ask=false requires 'current_passphrase' and 'new_passphrase'."
        quiet: true
      when: not (step_input.ask | bool)

    - name: "{{ step.uses }} ({{ step.id }}): Build the prompt fields and validations"
      ansible.builtin.set_fact:
        luks_user_fields: >-
          {{ ([{'label': 'Current disk encryption password', 'type': 'H'}]
                if luks_user_ask_current else [])
             + ([{'label': 'New disk encryption password', 'type': 'H'},
                 {'label': 'Confirm new disk encryption password', 'type': 'H'}]
                if luks_user_ask_new else []) }}
        luks_user_validations: >-
          {{ ([{'type': 'command', 'field': 'Current disk encryption password',
                'command': 'cryptsetup luksOpen --test-passphrase --key-file=- '
                           ~ (luks_user_info.device | quote),
                'error_message': 'The current disk encryption password was incorrect.'}]
                if luks_user_ask_current else [])
             + (step_input.password_policy
                | projectpotos.base.yad_password_validation('New disk encryption password',
                                                      'Confirm new disk encryption password')
                if luks_user_ask_new else []) }}
      no_log: "{{ not steps_debug_no_log }}"

    - name: "{{ step.uses }} ({{ step.id }}): Prompt for the disk encryption passphrase"
      projectpotos.base.yad:
        dialog: form
        title: "{{ steps_client_name }} Setup"
        text: |
          Your disk encryption password needs to be changed now, because the
          default password is insecure.

          IMPORTANT: Do not forget this password! Store it in a very safe place.
        fullscreen: true
        borders: 20
        align: center
        image: "{{ steps_logo }}"
        image_on_top: true
        fields: "{{ luks_user_fields }}"
        buttons:
          - label: OK
            id: 0
          - label: Change keyboard layout
            action: "{{ steps_setup_dir }}/change-keyboard-layout.sh"
        validations: "{{ luks_user_validations }}"
        max_attempts: 0
      register: luks_user_dialog
      no_log: "{{ not steps_debug_no_log }}"
      when:
        - step_input.ask | bool
        - luks_user_ask_current or luks_user_ask_new
      tags:
        - molecule-notest

    - name: "{{ step.uses }} ({{ step.id }}): Resolve the current and new passphrases"
      ansible.builtin.set_fact:
        luks_user_current: >-
          {{ luks_user_dialog.fields['Current disk encryption password']
             if ((step_input.ask | bool) and luks_user_ask_current)
             else step_input.current_passphrase }}
        luks_user_new: >-
          {{ luks_user_dialog.fields['New disk encryption password']
             if ((step_input.ask | bool) and luks_user_ask_new)
             else step_input.new_passphrase }}
      no_log: "{{ not steps_debug_no_log }}"

    - name: "{{ step.uses }} ({{ step.id }}): Change the LUKS passphrase"
      projectpotos.base.luks:
        action: change_key
        device: "{{ luks_user_info.device }}"
        passphrase: "{{ luks_user_current }}"
        new_passphrase: "{{ luks_user_new }}"
      no_log: "{{ not steps_debug_no_log }}"

    - name: "{{ step.uses }} ({{ step.id }}): Register outputs"
      ansible.builtin.include_tasks: steps/_register.yml
      vars:
        step_output:
          passphrase: "{{ luks_user_new }}"
        step_output_secret: true
