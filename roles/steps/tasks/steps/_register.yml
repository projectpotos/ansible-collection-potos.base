---
# A step includes this to publish its outputs so later
# steps can reference them as {{ steps.<id>.<field> }}.

- name: "{{ step.uses }} ({{ step.id }}): Register outputs in the registry"
  ansible.builtin.set_fact:
    steps_registry: >-
      {{ steps_registry | default({}, true)
         | combine({step.id: step_output}) }}
  no_log: "{{ (step_output_secret | default(false) | bool) and not steps_debug_no_log }}"

- name: "{{ step.uses }} ({{ step.id }}): Expose 'steps' alias after registering outputs"
  ansible.builtin.set_fact:
    steps: "{{ steps_registry }}"
  no_log: "{{ (step_output_secret | default(false) | bool) and not steps_debug_no_log }}"
