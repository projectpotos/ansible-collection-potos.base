---
# Category: user / Step: rotate_password
# Replace a local account's password (the ISO default is insecure). The new
# password is either entered by the operator (ask), supplied as a preset, or
# randomly generated. The effective password is published as an output (secret)
# so a later step (e.g. systemd_creds/store or openbao/write) can persist it --
# mirroring luks/random_rotate.
#
# inputs (step_input):
#   username         str   required. The account whose password is rotated.
#   ask              bool  default true. Prompt for the new password.
#   generate         bool  default false. Generate a random password instead of
#                          asking or using a preset. Takes precedence over ask.
#   password         str   required when ask=false and generate=false.
#   length           int   default 32. Generated password length.
#   password_policy  dict  optional. See yad_password_validation.
# outputs:
#   username  str  the account name
#   password  str  the password that was set (secret)

- name: "{{ step.uses }} ({{ step.id }}): Apply input defaults"
  ansible.builtin.set_fact:
    step_input: "{{ step_defaults | combine(step_input) }}"
  vars:
    step_defaults:
      ask: true
      generate: false
      length: 32
      password_policy: {}
  no_log: "{{ not steps_debug_no_log }}"

- name: "{{ step.uses }} ({{ step.id }}): Validate the username was provided"
  ansible.builtin.assert:
    that:
      - step_input.username | default('') | length > 0
    fail_msg: "user/rotate_password requires 'username'."
    quiet: true

- name: "{{ step.uses }} ({{ step.id }}): Validate the preset password when neither asking nor generating"
  ansible.builtin.assert:
    that:
      - step_input.password | default('') | length > 0
    fail_msg: "user/rotate_password requires 'password' when ask=false and generate=false."
    quiet: true
  when:
    - not (step_input.ask | bool)
    - not (step_input.generate | bool)

- name: "{{ step.uses }} ({{ step.id }}): Ask for the new password"
  projectpotos.base.yad:
    dialog: form
    title: "{{ steps_client_name }} Setup"
    text: |
      IMPORTANT: If your password contains special characters, please remember
      to select the appropriate keyboard layout first.

      Please choose a new password for {{ step_input.username }}.
    fullscreen: true
    borders: 20
    align: center
    image: "{{ steps_logo }}"
    image_on_top: true
    fields:
      - label: Password
        type: H
      - label: Confirm password
        type: H
    buttons:
      - label: OK
        id: 0
      - label: Change keyboard layout
        action: "{{ steps_setup_dir }}/change-keyboard-layout.sh"
    validations: >-
      {{ step_input.password_policy
         | projectpotos.base.yad_password_validation('Password', 'Confirm password') }}
    max_attempts: 0
  register: user_password_dialog
  no_log: "{{ not steps_debug_no_log }}"
  when:
    - step_input.ask | bool
    - not (step_input.generate | bool)
  tags:
    - molecule-notest

- name: "{{ step.uses }} ({{ step.id }}): Resolve the entered or preset password (when not generating)"
  ansible.builtin.set_fact:
    user_password_value: >-
      {{ user_password_dialog.fields['Password']
         if (step_input.ask | bool) else step_input.password }}
  no_log: "{{ not steps_debug_no_log }}"
  when: not (step_input.generate | bool)

- name: "{{ step.uses }} ({{ step.id }}): Set (or generate) the password"
  projectpotos.base.set_password:
    name: "{{ step_input.username }}"
    # Pass exactly one of password/generate -- they are mutually exclusive, and
    # Ansible counts any explicitly-supplied key (even generate=false), so the
    # unused one must be omitted entirely rather than passed as a falsey value.
    password: "{{ user_password_value | default(omit) }}"
    generate: "{{ (step_input.generate | bool) | ternary(true, omit) }}"
    length: "{{ step_input.length }}"
  register: user_password_result
  no_log: "{{ not steps_debug_no_log }}"

- name: "{{ step.uses }} ({{ step.id }}): Register outputs"
  ansible.builtin.include_tasks: steps/_register.yml
  vars:
    step_output:
      username: "{{ step_input.username }}"
      password: "{{ user_password_result.password }}"
    step_output_secret: true
