---
# Category: file / Step: write
# Write content to a file.
#
# inputs:
#   path     str  required. Destination path.
#   content  str  optional, default "". File content.
#   owner    str  optional, default root.
#   group    str  optional, default root.
#   mode     str  optional, default "0644".
#   secret   bool optional, default false. When true, hide content from the log.
# outputs:
#   path  str  the path that was written

- name: "{{ step.uses }} ({{ step.id }}): Apply input defaults"
  ansible.builtin.set_fact:
    step_input: "{{ step_defaults | combine(step_input) }}"
  vars:
    step_defaults:
      content: ""
      owner: root
      group: root
      mode: "0644"
      secret: false
  no_log: "{{ not steps_debug_no_log }}"

- name: "{{ step.uses }} ({{ step.id }}): Assert a destination path was provided"
  ansible.builtin.assert:
    that:
      - step_input.path | default('') | length > 0
    fail_msg: "file/write requires step_input.path"
    quiet: true

- name: "{{ step.uses }} ({{ step.id }}): Write file"
  ansible.builtin.copy:
    dest: "{{ step_input.path }}"
    content: "{{ step_input.content }}"
    owner: "{{ step_input.owner }}"
    group: "{{ step_input.group }}"
    mode: "{{ step_input.mode }}"
  no_log: "{{ (step_input.secret | bool) and not steps_debug_no_log }}"

- name: "{{ step.uses }} ({{ step.id }}): Register outputs"
  ansible.builtin.include_tasks: steps/_register.yml
  vars:
    step_output:
      path: "{{ step_input.path }}"
