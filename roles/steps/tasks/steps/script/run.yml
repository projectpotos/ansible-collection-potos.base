---
# Category: script / Step: run
# Run a command (or an inline script) and capture its stdout as an output.
#
# Provide exactly one of 'command' or 'script'.
#
# inputs:
#   command      str   The command line to run.
#   script       str   A full script. It is written to a temp dir, made
#                      executable and run.
#   interpreter  str   optional, script-only. Run the script via this
#                      interpreter (e.g. "/bin/bash"). If empty, the scripts
#                      shebang is used.
#   chdir        str   optional. Working directory.
#   creates      str   optional. Skip the run if this path already exists.
#   secret       bool  default true. Mark the captured stdout secret (no_log).
# outputs:
#   stdout  str  the command's stdout, stripped of surrounding whitespace
#   stderr  str  the command's stderr, stripped of surrounding whitespace
#   rc      int  the command's return code

- name: "{{ step.uses }} ({{ step.id }}): Apply input defaults"
  ansible.builtin.set_fact:
    step_input: "{{ step_defaults | combine(step_input) }}"
  vars:
    step_defaults:
      secret: true

- name: "{{ step.uses }} ({{ step.id }}): Validate exactly one of command/script was provided"
  ansible.builtin.assert:
    that:
      - (step_input.command | default('') | length > 0) or (step_input.script | default('') | length > 0)
      - not ((step_input.command | default('') | length > 0) and (step_input.script | default('') | length > 0))
    fail_msg: "script/run requires exactly one of 'command' or 'script'."
    quiet: true

- name: "{{ step.uses }} ({{ step.id }}): Run the command/script"
  block:
    - name: "{{ step.uses }} ({{ step.id }}): Create a temp dir for the script"
      ansible.builtin.tempfile:
        state: directory
        prefix: potos-script-run.
      register: script_run_tmp
      when: step_input.script | default('') | length > 0

    - name: "{{ step.uses }} ({{ step.id }}): Write the script to the temp dir"
      ansible.builtin.copy:
        content: "{{ step_input.script }}"
        dest: "{{ script_run_tmp.path }}/script"
        mode: "0700"
      no_log: "{{ (step_input.secret | bool) and not steps_debug_no_log }}"
      when: step_input.script | default('') | length > 0

    - name: "{{ step.uses }} ({{ step.id }}): Resolve the command line"
      ansible.builtin.set_fact:
        script_run_cmd: >-
          {{
            step_input.command
            if (step_input.command | default('') | length > 0)
            else ((step_input.interpreter | default('', true)) ~ ' ' ~ script_run_tmp.path ~ '/script') | trim
          }}
      no_log: "{{ (step_input.secret | bool) and not steps_debug_no_log }}"

    - name: "{{ step.uses }} ({{ step.id }}): Run the command"
      ansible.builtin.command:
        cmd: "{{ script_run_cmd }}"
        chdir: "{{ step_input.chdir | default(omit) }}"
        creates: "{{ step_input.creates | default(omit) }}"
      register: script_run_result
      changed_when: true
      no_log: "{{ (step_input.secret | bool) and not steps_debug_no_log }}"

    - name: "{{ step.uses }} ({{ step.id }}): Register outputs"
      ansible.builtin.include_tasks: steps/_register.yml
      vars:
        step_output:
          stdout: "{{ script_run_result.stdout | default('') | trim }}"
          stderr: "{{ script_run_result.stderr | default('') | trim }}"
          rc: "{{ script_run_result.rc | default(0) }}"
        step_output_secret: "{{ step_input.secret | bool }}"

  always:
    - name: "{{ step.uses }} ({{ step.id }}): Clean up the script temp dir"
      ansible.builtin.file:
        path: "{{ script_run_tmp.path }}"
        state: absent
      when: script_run_tmp.path is defined
