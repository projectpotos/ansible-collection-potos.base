[project]
name = "potos-base-dev"
version = "0.0.0"
description = "Development and test environment for the potos.base Ansible collection."
requires-python = ">=3.12"

[dependency-groups]
# Local development and test tooling, managed with uv (`uv sync`).
# Runtime collection dependencies live in galaxy.yml / requirements.txt.
dev = [
    "ansible>=13.0.0",
    "ansible-lint~=26.4.0",
    "yamllint~=1.38.0",
    "molecule~=26.4.0",
    "molecule-plugins~=25.8.12",
    "docker~=7.1.0",
    "pytest-ansible",
    "pytest-xdist",
    "ruff>=0.15.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["ansible_collections.potos.base"]
lines-after-imports = 2

[tool.pytest.ini_options]
addopts = ["-vvv", "-n", "2", "--log-level", "WARNING", "--color", "yes"]
filterwarnings = ["ignore:AnsibleCollectionFinder has already been configured"]
testpaths = ["tests"]
