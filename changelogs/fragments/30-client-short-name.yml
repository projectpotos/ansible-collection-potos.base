---
bugfixes:
  - The ``firstboot`` role now applies ``client_name.short`` from the system
    config (``/etc/potos/config.yml``) to ``firstboot_client_name``, so
    firstboot dialogs are labelled with the configured client name instead of
    always showing ``potos``.

breaking_changes:
  - Removed the undocumented ``potos_plays_client_short_name`` fallback from
    ``basics_client_name`` and ``firstboot_client_name``. Both default to
    ``potos`` and are overridden at run time by ``client_name.short`` from the
    system config; use ``role_vars`` or the role variables directly for
    overrides.
