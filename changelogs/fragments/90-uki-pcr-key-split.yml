---
breaking_changes:
  - UKIs now use two different PCR signing keypairs.
    One for the initrd phase only, and one for the fully booted system.
minor_changes:
  - improved systemd_creds ``with_key`` options for PCR 11 signing keys.
bugfixes:
  - encrypting with ``tpm2_public_key`` and a ``with_key``
    type without the public-key property now fails instead of letting
    ``systemd-creds`` silently seal without the signed PCR policy.
