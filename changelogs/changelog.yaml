ancestor: null
releases:
  0.1.0:
    changes:
      breaking_changes:
        - All filenames, paths and systemd units installed by the ``basics`` role now
          use literal ``potos`` instead of the short client name - ``/var/lib/potos``,
          ``/var/log/potos``, ``potos_inventory``, ``/usr/local/bin/potos-ansible-pull``,
          ``potos-ansible-pull@.service``, ``potos-ansible-pull-<runtype>.timer``, ``/etc/logrotate.d/potos-ansible-pull``
          and ``/var/lock/potos.lock``. ``basics_client_name`` is a display label only
          (unit descriptions, dialog titles, notifications).
        - Removed the undocumented ``potos_plays_client_short_name`` fallback from ``basics_client_name``
          and ``firstboot_client_name``. Both default to ``potos`` and are overridden
          at run time by ``client_name.short`` from the system config; use ``role_vars``
          or the role variables directly for overrides.
        - Renamed all role variables to match the new role names, e.g. ``potos_basics_*``
          becomes ``basics_*``, ``potos_firstboot_*`` becomes ``firstboot_*`` and ``potos_steps_*``
          becomes ``steps_*``.
        - Renamed the modules ``potos_luks``, ``potos_openbao``, ``potos_set_password``
          and ``potos_systemd_creds`` to ``luks``, ``openbao``, ``set_password`` and
          ``systemd_creds``.
        - Renamed the roles ``potos_basics``, ``potos_firstboot`` and ``potos_steps``
          to ``basics``, ``firstboot`` and ``steps``.
        - The collection namespace changed from ``potos`` to ``projectpotos``. All content
          must now be referenced as ``projectpotos.base.*``.
      bugfixes:
        - The ``firstboot`` role now applies ``client_name.short`` from the system config
          (``/etc/potos/config.yml``) to ``firstboot_client_name``, so firstboot dialogs
          are labelled with the configured client name instead of always showing ``potos``.
        - The ``potos-ansible-pull`` wrapper no longer greps the accumulated ``ansible-pull.log``
          for ``failed=`` recap lines to detect failures. The log is appended across
          runs and only rotated weekly, so a single failed run caused every following
          successful run to broadcast a failure notification until rotation. The playbook
          exit code is now the sole failure signal. This is subject to change if we
          ever switch to a log file per run.
        - The copy button shown by the ``openbao/login`` step doesn't crash anymore.
      minor_changes:
        - Added `DOCUMENTATION`, `EXAMPLES` and `RETURN` to the `resolve_step_refs`
          and `yad_password_validation` filter plugins.
        - Added `stderr` to the outputs of the `script/run` step, allowing scripts to
          return error messages.
        - Introduced the ``steps`` role, a declarative, ordered step framework whose
          steps can consume each other's outputs.
        - Reworked the ``firstboot`` role to use the new step framework instead of hard-coded
          task files.
    fragments:
      - 10-firstboot-steps.yml
      - 20-rename-namespace.yml
      - 30-client-short-name.yml
      - 30-potos-literal-paths.yml
      - 40-steps-script-run-stderr.yml
      - 50-openbao-copy-button.yml
      - 60-stale-log-failure-notification.yml
      - 70-filter-plugin-docs.yml
    modules:
      - description: Do various LUKS operations
        name: luks
        namespace: ""
      - description: Interact with OpenBao KV engine
        name: openbao
        namespace: ""
      - description: Set a local user's password using chpasswd
        name: set_password
        namespace: ""
      - description: Encrypt or decrypt a secret with systemd\-creds
        name: systemd_creds
        namespace: ""
      - description: Display a YAD (GTK) dialog and return the user's input
        name: yad
        namespace: ""
    plugins:
      filter:
        - description: Resolve step output and fact references in step inputs
          name: resolve_step_refs
          namespace: null
        - description: Build yad dialog validations from a password policy
          name: yad_password_validation
          namespace: null
    release_date: "2026-07-10"
  0.2.0:
    changes:
      breaking_changes:
        - Stage 1 now fails when the specs ``requirements.yml`` lists ``projectpotos.base``.
          It would shadow the system-wide install for stage 2 only, leaving the two
          stages on different versions - pin the base collection in ``base-requirements.yml``
          instead.
      major_changes:
        - The periodic run can now update the ``projectpotos.base`` collection itself.
          When the specs repo ships a ``base-requirements.yml`` (listing only ``projectpotos.base``),
          the end of stage 1 force-installs it into the system-wide collections path.
          The update is non-fatal on failure and fully converges after two runs - the
          bumping run already applies stage 2 with the new version, the next run executes
          the new prepare/basics code and re-templates the wrapper.
      minor_changes:
        - The specs galaxy dir moved from ``<specs-clone>/.galaxy`` to ``/var/lib/potos/galaxy``
          (``basics_specs_galaxy_dir``). It is wiped after each successful clone instead
          of implicitly with the clone dir, so dependencies removed from ``requirements.yml``
          still disappear from the system, while a failed clone no longer destroys the
          last good install.
        - The system-wide collections path used by the wrapper and the base self-update
          is configurable via ``basics_system_collections_dir`` (default ``/usr/share/ansible/collections``).
    fragments:
      - 70-base-self-update-and-galaxy-dir-move.yml
    release_date: "2026-07-10"
