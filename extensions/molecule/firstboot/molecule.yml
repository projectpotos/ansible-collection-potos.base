---
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/tests/requirements.yml

driver:
  name: podman

platforms:
  - name: potos-firstboot
    image: "ghcr.io/projectpotos/docker-${MOLECULE_DISTRO:-fedora45}-ansible:latest"
    pre_build_image: true
    override_command: false
    privileged: false
    systemd: "true"

provisioner:
  name: ansible

verifier:
  name: ansible

scenario:
  # firstboot isn't idempotent by design, so we can't test that.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
