---
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  vars:
    luks_img: /var/lib/potos/test-luks.img
    luks_initial_pass: "Zt7ZkQ9mW2xPv4rLb8c"

  tasks:
    - name: Install the role dependencies
      ansible.builtin.package:
        name:
          - hostname
          - util-linux
          - cryptsetup
          - cracklib-dicts
        state: present

    - name: Ensure the state directory for the LUKS image exists
      ansible.builtin.file:
        path: /var/lib/potos
        state: directory
        mode: "0755"

    - name: Allocate the file for the LUKS image
      ansible.builtin.command:
        cmd: dd if=/dev/zero of={{ luks_img }} bs=1M count=32
        creates: "{{ luks_img }}"

    - name: Format the image as LUKS2 with the known initial passphrase
      ansible.builtin.command:
        cmd: cryptsetup luksFormat --type luks2 --batch-mode --key-file=- {{ luks_img }}
        stdin: "{{ luks_initial_pass }}"
        stdin_add_newline: false
      changed_when: true

    - name: Point /etc/crypttab to the image so the discover action finds it
      ansible.builtin.copy:
        dest: /etc/crypttab
        mode: "0644"
        content: |
          potostest {{ luks_img }} none luks

    - name: Ensure /etc/potos exists
      ansible.builtin.file:
        path: /etc/potos
        state: directory
        mode: "0755"

    - name: Provide a system config
      ansible.builtin.copy:
        dest: /etc/potos/config.yml
        mode: "0644"
        content: |
          firstboot:
            steps:
              - id: rotate_disk
                uses: luks/user_rotate
                input:
                  ask: false
                  current_passphrase: "Zt7ZkQ9mW2xPv4rLb8c"
                  new_passphrase: "Rj4NpH6dW9kLq2mXc5v"
              - id: random_rotate
                uses: luks/random_rotate
                input:
                  current_passphrase: "Rj4NpH6dW9kLq2mXc5v"
                  length: 64
              - id: write_random_pass
                uses: file/write
                input:
                  path: /var/lib/potos/random-pass
                  mode: "0400"
                  secret: true
                  content: "{% raw %}{{ steps.random_rotate.passphrase }}{% endraw %}"
              - id: tpm_skip
                uses: luks/tpm_unlock
                input:
                  device: /var/lib/potos/no-such-luks
                  passphrase: unused-in-skip
                  skip_if_unencrypted: true
