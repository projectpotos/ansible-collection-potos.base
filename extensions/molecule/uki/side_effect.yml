---
- name: Side effect
  hosts: all
  become: true
  gather_facts: true

  tasks:
    # grub2's %posttrans copies the real GRUB over EFI/fedora/grubx64.efi and
    # shim's re-adds EFI/BOOT/fbx64.efi on every install/upgrade; replay that
    # with a reinstall while no file-watch-service is active.
    - name: Reinstall the bootloader packages like an update would
      ansible.builtin.command: # noqa: command-instead-of-module
        argv:
          [dnf, reinstall, -y, grub2-efi-x64, shim-x64, systemd-boot-unsigned]
      changed_when: true

    - name: The reinstall must have clobbered EFI/fedora/grubx64.efi
      ansible.builtin.command: # noqa: command-instead-of-module
        argv:
          [
            sbverify,
            --cert,
            /etc/secureboot/mok.crt,
            /boot/efi/EFI/fedora/grubx64.efi,
          ]
      register: uki_clobbered
      changed_when: false
      failed_when: uki_clobbered.rc == 0

    - name: The booted systemd-boot is untouched by the reinstall
      ansible.builtin.command: # noqa: command-instead-of-module
        argv:
          [
            sbverify,
            --cert,
            /etc/secureboot/mok.crt,
            /boot/efi/EFI/potos/grubx64.efi,
          ]
      changed_when: false

    - name: The reinstall must have re-added fbx64.efi
      ansible.builtin.stat:
        path: /boot/efi/EFI/BOOT/fbx64.efi
      register: uki_fbx64
      failed_when: not uki_fbx64.stat.exists

    - name: Corrupt the booted MokManager copy
      ansible.builtin.copy:
        dest: /boot/efi/EFI/potos/mmx64.efi
        content: not-an-efi-binary
        mode: "0700"

    - name: Start the heal service (the boot-time re-check)
      ansible.builtin.systemd:
        name: potos-bootchain-heal.service
        state: started

    - name: Checksum the packaged and booted boot chain files
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - /boot/efi/EFI/fedora/shimx64.efi
        - /boot/efi/EFI/potos/shimx64.efi
        - /boot/efi/EFI/BOOT/BOOTX64.EFI
        - /boot/efi/EFI/fedora/mmx64.efi
        - /boot/efi/EFI/potos/mmx64.efi
        - /boot/efi/EFI/BOOT/mmx64.efi
        - /boot/efi/EFI/BOOT/fbx64.efi
      register: uki_healed

    - name: The heal service synced shim and MokManager and dropped fbx64.efi
      ansible.builtin.assert:
        that:
          - uki_sums[0] == uki_sums[1]
          - uki_sums[0] == uki_sums[2]
          - uki_sums[3] == uki_sums[4]
          - uki_sums[3] == uki_sums[5]
          - not uki_healed.results[6].stat.exists
      vars:
        uki_sums: "{{ uki_healed.results | map(attribute='stat.checksum', default='') | list }}"

    - name: Start the path watch
      ansible.builtin.systemd:
        name: potos-bootchain-heal.path
        state: started

    - name: Corrupt the booted MokManager copy again
      ansible.builtin.copy:
        dest: /boot/efi/EFI/potos/mmx64.efi
        content: not-an-efi-binary
        mode: "0700"

    - name: Reinstall shim with the watch active
      ansible.builtin.command: # noqa: command-instead-of-module
        argv: [dnf, reinstall, -y, shim-x64]
      changed_when: true

    - name: The path unit resyncs MokManager on its own
      ansible.builtin.command: # noqa: command-instead-of-module
        argv:
          [cmp, /boot/efi/EFI/fedora/mmx64.efi, /boot/efi/EFI/potos/mmx64.efi]
      register: uki_path_heal
      retries: 15
      delay: 2
      until: uki_path_heal.rc == 0
      changed_when: false

    - name: The path unit removed fbx64.efi again
      ansible.builtin.stat:
        path: /boot/efi/EFI/BOOT/fbx64.efi
      register: uki_fbx64_again
      failed_when: uki_fbx64_again.stat.exists

    - name: Run systemd-boot-update with the re-signing override
      ansible.builtin.systemd:
        name: systemd-boot-update.service
        state: started

    - name: grubx64.efi is still host-signed after systemd-boot-update
      ansible.builtin.command: # noqa: command-instead-of-module
        argv:
          [
            sbverify,
            --cert,
            /etc/secureboot/mok.crt,
            /boot/efi/EFI/potos/grubx64.efi,
          ]
      changed_when: false

    # make sure changing to the cmdline works as intended.
    - name: Checksum the UKIs before the cmdline change
      ansible.builtin.find:
        paths: /boot/efi/EFI/Linux
        patterns: "*.efi"
        get_checksum: true
      register: uki_pre_extra

    - name: Re-run the role with a changed cmdline extra
      ansible.builtin.include_role:
        name: projectpotos.base.uki
      vars:
        uki_enabled: true
        uki_cmdline_extra: audit=1 potos.molecule=extra

    - name: Read the updated cmdline and the persisted base
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/kernel/cmdline
        - /var/lib/potos/uki-cmdline-base
      register: uki_cmdline_files

    - name: Checksum the UKIs after the cmdline change
      ansible.builtin.find:
        paths: /boot/efi/EFI/Linux
        patterns: "*.efi"
        get_checksum: true
      register: uki_post_extra

    - name: The changed extra was applied and the UKIs were rebuilt
      ansible.builtin.assert:
        that:
          - "'potos.molecule=extra' in uki_cmdline"
          - "'root=UUID=11111111-2222-3333-4444-555555555555' in uki_cmdline"
          - "'potos.molecule=extra' not in uki_base"
          - "'rd.shell=0' not in uki_base"
          - uki_pre_extra.files | map(attribute='checksum') | sort
            != uki_post_extra.files | map(attribute='checksum') | sort
        fail_msg: >-
          cmdline={{ uki_cmdline }} base={{ uki_base }}
      vars:
        uki_cmdline: "{{ uki_cmdline_files.results[0].content | b64decode }}"
        uki_base: "{{ uki_cmdline_files.results[1].content | b64decode }}"
